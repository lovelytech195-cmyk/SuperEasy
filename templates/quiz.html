<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
    <title>SuperEasy_quizz</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <script type="text/javascript">
    (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
    })(window, document, "clarity", "script", "ym4rgkcved");
</script>
   
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .quiz-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 600px;
        }
        h3 {
            color: #333;
            margin-bottom: 20px;
        }
        .options-list {
            list-style: none;
            padding: 0;
        }
        .option-btn {
            display: block;
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 10px;
            background-color: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            text-align: left;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .option-btn:hover:not(:disabled) {
            background-color: #e2e6ea;
            border-color: #dae0e5;
        }
        .option-btn.correct {
            background-color: #d4edda !important;
            border-color: #28a745 !important;
            color: #155724;
        }
        .option-btn.wrong {
            background-color: #f8d7da !important;
            border-color: #dc3545 !important;
            color: #721c24;
        }
        .option-btn:disabled {
            cursor: not-allowed;
        }
        .action-container {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }
        #prev-btn {
            background-color: #6c757d;
            color: white;
            display: none;
        }
        #prev-btn:hover {
            background-color: #5a6268;
        }
        #next-btn {
            background-color: #007bff;
            color: white;
            display: none;
        }
        #next-btn:hover {
            background-color: #0056b3;
        }
        #solution-box {
            margin-top: 15px;
            padding: 12px;
            background-color: #fff3cd;
            border: 1px solid #ffeeba;
            border-radius: 6px;
            color: #856404;
            display: none;
        }
    </style>
</head>
<body>

    <div class="quiz-card">
        <div id="question-container">
            <h3 id="question-title">Question text goes here</h3>
            <div class="options-list" id="options-list"></div>
        </div>

        <div id="solution-box"></div>

        <div class="action-container">
            <a class="btn" id="prev-btn" href="#">Previous</a>
            <a class="btn" id="next-btn" href="#">Next Question</a>
        </div>
    </div>

    <script>
        // Flask data parsing safely
        const quizData = JSON.parse('{{ data | tojson | safe }}');
        
        // URL se query parameter 'q' read karte hain (jaise ?q=1, ?q=2)
        const urlParams = new URLSearchParams(window.location.search);
        let qParam = parseInt(urlParams.get('q'));
        
        // Agar 'q' parameter na ho ya galat ho, toh default 1st question (index 0) maan lenge
        let currentIdx = (isNaN(qParam) || qParam < 1) ? 0 : qParam - 1;
        if (currentIdx >= quizData.questions.length) {
            currentIdx = quizData.questions.length - 1;
        }

        const questionTitle = document.getElementById("question-title");
        const optionsList = document.getElementById("options-list");
        const prevBtn = document.getElementById("prev-btn");
        const nextBtn = document.getElementById("next-btn");
        const solutionBox = document.getElementById("solution-box");

        function loadQuestion() {
            solutionBox.style.display ="none";
            solutionBox.innerHTML = "";
            optionsList.innerHTML = "";

            const currentQ = quizData.questions[currentIdx];
            questionTitle.innerText = `Q${currentIdx + 1}.${currentQ.question}`;

            // Previous button visibility aur link set karna
            if (currentIdx === 0) {
                prevBtn.style.display = "none";
            } else {
                prevBtn.style.display = "inline-block";
                prevBtn.href = `?q=${currentIdx}`; // Pichle question ka URL
            }

            // Next button visibility aur link set karna
            if (currentIdx < quizData.questions.length - 1) {
                nextBtn.style.display = "inline-block";
                nextBtn.href = `?q=${currentIdx + 2}`; // Agle question ka URL
                nextBtn.innerText = "Next Question";
            } else {
                nextBtn.style.display = "inline-block";
                nextBtn.href = "#";
                nextBtn.innerText = "Finish Quiz";
                nextBtn.onclick = (e) => {
                    e.preventDefault();
                    document.querySelector(".quiz-card").innerHTML = `<h2>Quiz Completed! 🎉</h2><p>Aapne sabhi questions successfully complete kar liye hain.</p>`;
                };
            }

            // Options generation
            for (let key in currentQ.options) {
                const btn = document.createElement("button");
                btn.className = "option-btn";
                btn.innerText = `${key}.${currentQ.options[key]}`;
                btn.onclick = () => checkAnswer(key, currentQ.correct_answer, currentQ.detailed_explanation, btn);
                optionsList.appendChild(btn);
            }
        }

        function checkAnswer(selectedKey, correctKey, explanation, selectedBtn) {
            const allButtons = optionsList.getElementsByClassName("option-btn");

            for (let btn of allButtons) {
                btn.disabled = true;
            }

            if (selectedKey === correctKey) {
                selectedBtn.classList.add("correct");
            } else {
                selectedBtn.classList.add("wrong");
                for (let btn of allButtons) {
                    if (btn.innerText.startsWith(correctKey)) {
                        btn.classList.add("correct");
                    }
                }
            }

            if (explanation) {
                solutionBox.style.display = "block";
                solutionBox.innerHTML = `<strong>Explanation:</strong> ${explanation}`;
            }
        }

        // Initialize question based on URL parameter
        loadQuestion();
    </script>

</body>
</html>
